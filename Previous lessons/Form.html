<!DOCTYPE html>
<html>
<head>
    
    <title>HTML forms</title>
</head>
<body>

    <h1>HTML Forms</h1>

    <form>
      <!--Text input-->
        <label for="username">Enter your name : </label>
        <input type="text" id="username" name="username" placeholder="Name" required>
        <br>
        <br>
        <label for="email">Enter your email</label>
        <input type="email" id="email" name="email" placeholder="ex.  edmarts.edm@gamil.com" required>
        <br>
        <br>
        <label for="password">Password : </label>
        <input type="password" id="password" name="password" required>

        <!--Radio buttons-->
        <p>Select your age: </p>

        <input type="radio" name="age" value="0-10" id="op 1">
        <label for="op 1">0-10</label>
        <br>
        <input type="radio" name="age" value="10-18" id="op 2">
        <label for="op 2">0-18</label>
        <br>
        <input type="radio" name="age" value="20+" id="op 3">
        <label for="op 3">20+ </label>
        <br>
        <br>

        <!--select fields-->
        <label for="question">Security question: </label>
        <select name="question" id="question">
            <option value="q1">What color are your favourite pair of socks?</option>
            <option value="q2">What is your favourite vegetable?</option>
            <option value="q3">What is your name?</option>
        </select>
        <br>
        <br>

        <label for="answer">Answer: </label>
        <input type="text" id="answer" name="answer">                   

        <br>
        <br>

        <!--Text area-->
        <label for="bio">Enter your bio: </label><br>
        <textarea name="bio" id="bio" cols="30" rows="10" placeholder="About you..."></textarea>
        
        <br>
        <br>

        <input type="submit" value="Submit the form">
    </form>


</body>
</html>
