<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Homework Reminder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="header">
  <a href="#default" class="logo">
    <span class="logo-edu">Edu</span><span class="logo-track">Track</span>
  </a>
  <div class="header-right">
    <a class="active" href="#home">Home</a>
    <a href="#contact">Contact</a>
    <a href="#about">About</a>
  </div>
</div>

  <button id="show-reminder-btn">
    Homework Reminder
    <span id="reminder-badge"></span>
  </button>

  <div id="daily-checklist" class="daily-checklist">
  <button id="hide-daily-checklist" style="float:right;">Hide</button>

    <h2>Daily Checklist</h2>
    <ul>
      <li><input type="checkbox" id="check1" /> <label for="check1">Review class notes</label></li>
      <li><input type="checkbox" id="check2" /> <label for="check2">Complete assignments</label></li>
      <li><input type="checkbox" id="check3" /> <label for="check3">Prepare for exams</label></li>
      <li><input type="checkbox" id="check4" /> <label for="check4">Read textbooks</label></li>
      <li><input type="checkbox" id="check5" /> <label for="check5">Participate in study groups</label></li>
    </ul>

  <div class="container">
  <button id="hide-reminder-btn" style="float:right;">Hide</button>
  <h1>Homework Reminder</h1>
  <form id="reminder-form">
    <input type="text" id="reminder-input" placeholder="Add a new reminder" required />
    <button type="submit">Add</button>
  </form>
  <ul id="reminder-list"></ul>
</div>

  <script src="script.js"></script>
</body>
</html>
